# Production topology overlay — see docs/DEPLOYMENT.md.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Adds app and nginx on top of the base qdrant/postgres infra
# (docker-compose.yml). qdrant/postgres stay loopback-bound — the base file
# already does that, this overlay only adds restart policies to them. nginx is
# the sole service binding public ports (80/443). ADR 0011 removed the RQ
# worker and its Redis broker; cache refreshes run inside the app process.

services:
  qdrant:
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - qdrant
      - postgres
    env_file: .env
    environment:
      # Override localhost URLs (config.py's dev defaults) with container
      # service names.
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql://ticket_match:ticket_match@postgres:5432/ticket_match

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
