# Nginx configuration — single-domain API ingress.
#
# The domain-specific server block lives in
# nginx/templates/ticket-match-rag.conf.template, substituted from
# API_DOMAIN (set in .env) into /etc/nginx/conf.d/ every time the container
# starts — see that file for details. This file only holds the static,
# domain-independent top-level config.
#
# There's no separate frontend domain here (ADR 0010 retired the standalone
# demo UI) — just the one API_DOMAIN server block, unlike Contract
# Intelligence's two-domain nginx setup.
#
# TLS setup (run once on the host before starting Docker Compose):
#   certbot certonly --standalone -d "$API_DOMAIN"
#
# Certs land in /etc/letsencrypt/live/<domain>/ and are mounted read-only
# into the nginx container via docker-compose.prod.yml.
#
# Auto-renewal (add to host crontab):
#   0 3 * * * certbot renew --quiet && docker compose -f docker-compose.yml -f docker-compose.prod.yml exec nginx nginx -s reload

events {
    worker_connections 1024;
}

http {
    # Use Docker Compose's embedded DNS so the upstream name (app) resolves
    # at request time, not at startup — avoids "host not found" when the
    # app container is still starting up.
    resolver 127.0.0.11 valid=10s;

    include /etc/nginx/conf.d/*.conf;
}
